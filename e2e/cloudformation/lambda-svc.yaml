AWSTemplateFormatVersion: "2010-09-09"
Description: "edd-java E2E service lambda (ping/pong): java25 + SnapStart, BUILD alias, standard commands queue + source mapping, optional S3 import mapping, API invoke permission."

Parameters:
  EnvironmentNameLower:
    Type: String
  ResourceName:
    Type: String
    Description: "Service name, e.g. ping-svc. Drives function + queue names and the store table prefix."
  Handler:
    Type: String
    Description: "Lambda handler FQCN, e.g. com.alphaprosoft.edd.e2e.ping.PingLambda::handleRequest"
  Region:
    Type: String
  DeploymentBucketName:
    Type: String
  S3Key:
    Type: String
  RouterQueueUrl:
    Type: String
    Description: "Router response queue URL; effects are sent here."
  ApiUrl:
    Type: String
    Default: ""
    Description: "Base API URL for cross-service remote deps (EDD_API_URL)."
  CQRSApiId:
    Type: String
    Default: ""
    Description: "REST API id, to scope the apigateway invoke permission."
  EnableImport:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  ImportQueueArn:
    Type: String
    Default: ""
  LambdaMemorySize:
    Type: Number
    Default: 1024
  LambdaTimeout:
    Type: Number
    Default: 60

Conditions:
  IsImportEnabled: !Equals [!Ref EnableImport, "true"]
  HasApi: !Not [!Equals [!Ref CQRSApiId, ""]]

Resources:

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentNameLower}-${ResourceName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"

  LambdaPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${EnvironmentNameLower}-${ResourceName}-policy"
      Roles:
        - !Ref LambdaRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:BatchWriteItem
              - dynamodb:BatchGetItem
              - dynamodb:TransactWriteItems
              - dynamodb:CreateTable
              - dynamodb:DescribeTable
            Resource: "*"
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
            Resource: "*"
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ChangeMessageVisibility
            Resource: !Sub "arn:aws:sqs:${Region}:${AWS::AccountId}:${EnvironmentNameLower}*"

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaPolicy
    Properties:
      FunctionName: !Sub "${EnvironmentNameLower}-${ResourceName}"
      Handler: !Ref Handler
      Runtime: "java25"
      Role: !GetAtt LambdaRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      SnapStart:
        ApplyOn: PublishedVersions
      Code:
        S3Bucket: !Ref DeploymentBucketName
        S3Key: !Ref S3Key
      Environment:
        Variables:
          EnvironmentNameLower: !Ref EnvironmentNameLower
          EDD_STORE_REGION: !Ref Region
          EDD_STORE_TABLEPREFIX: !Sub "${EnvironmentNameLower}-${ResourceName}"
          EDD_STORE_BUCKET: !Sub "${AWS::AccountId}-${EnvironmentNameLower}-aggregates"
          EDD_ROUTER_QUEUE_URL: !Ref RouterQueueUrl
          EDD_API_URL: !Ref ApiUrl

  LambdaVersion:
    Type: AWS::Lambda::Version
    DependsOn: LambdaFunction
    DeletionPolicy: Retain
    Properties:
      FunctionName: !Ref LambdaFunction
      # Description must change whenever published config changes, otherwise CF does not create a
      # new Version and the BUILD alias keeps the old snapshot.
      Description: !Sub "code ${S3Key} mem ${LambdaMemorySize}"

  LambdaAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref LambdaFunction
      Name: "BUILD"
      FunctionVersion: !GetAtt LambdaVersion.Version

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasApi
    DependsOn:
      - LambdaAlias
    Properties:
      FunctionName: !GetAtt LambdaAlias.AliasArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${Region}:${AWS::AccountId}:${CQRSApiId}/*"

  CommandsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentNameLower}-${ResourceName}-commands"
      DelaySeconds: 0
      VisibilityTimeout: 120

  CommandsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CommandsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Resource: "*"

  CommandsSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn:
      - LambdaAlias
    Properties:
      Enabled: true
      BatchSize: 1
      EventSourceArn: !GetAtt CommandsQueue.Arn
      FunctionName: !Ref LambdaAlias

  ImportSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: IsImportEnabled
    DependsOn:
      - LambdaAlias
    Properties:
      Enabled: true
      BatchSize: 1
      EventSourceArn: !Ref ImportQueueArn
      FunctionName: !Ref LambdaAlias

Outputs:
  LambdaFunctionName:
    Value: !Ref LambdaFunction
  CommandsQueueUrl:
    Value: !Ref CommandsQueue
